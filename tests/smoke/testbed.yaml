
devices:
  mock-iosxe-1:
    type: router
    os: iosxe
    connections:
      defaults:
        class: unicon.Unicon
        via: radkit
        debug: True
      radkit:
        command: radkit-interactive --service-sn %ENV{RADKIT_SERVICE_SN} --device-name %SELF --cert-identity %ENV{RADKIT_IDENTITY}

  linux-server:
    type: router
    os: linux
    connections:
      defaults:
        class: unicon.Unicon
        via: radkit
        debug: True
      radkit:
        command: radkit-interactive --service-sn %ENV{RADKIT_SERVICE_SN} --device linux-server --cert-identity %ENV{RADKIT_IDENTITY}
