name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Needed to create GitHub releases
  id-token: write # Needed for PyPI Trusted Publishing (OIDC)

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  publish:
    name: Build and Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/robotframework-radkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distribution packages
        run: uv build

      - name: Publish package to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          # uv automatically uses Trusted Publishing (OIDC) if available,
          # or falls back to UV_PUBLISH_TOKEN if configured as a secret.
          uv publish

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            dist/*
